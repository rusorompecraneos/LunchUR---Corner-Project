{% extends 'Layouts/base.html'%}

{%block content %}

<!DOCTYPE html>
    <html>
    <head>
        <title>Registro:</title>
    </head>
    <body>
        <h1>Registro</h1>
        <form method="post">
            {% csrf_token %}
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre"><br><br>
            <label for="numero_documento">Número de documento:</label><br>
            <input type="text" id="numero_documento" name="numero_documento"><br><br>
            <label for="correo_electronico">Correo electrónico:</label><br>
            <input type="email" id="correo_electronico" name="correo_electronico"><br><br>
            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" name="password"><br><br>
            <input type="submit" value="Registrarse">
        </form>
    </body>
    </html>

{% endblock%}
