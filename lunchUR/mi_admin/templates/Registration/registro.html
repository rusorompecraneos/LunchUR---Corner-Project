{% extends 'Layouts/base.html'%}

{%block content %}

{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title> 

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">  <!--todavía no vamos a manejar el css pero JAJAJA pues pa ya tenerlo-->
</head>
<body>
    <div class="register-container">
        <h2>Crear Cuenta</h2> 

        <!--mensajes de error-->
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="{{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" action="{% url 'registro' %}" class="register-form"> 
            {% csrf_token %} 
            
            <div class="input-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
            </div>

            <div class="input-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>
            </div>

            <div class="input-group">
                <label for="numero_documento">Número de documento:</label>
                <input type="text" id="numero_documento" name="numero_documento" placeholder="Tu documento de identidad" required>
            </div>

            <div class="input-group">
                <label for="correo_electronico">Correo electrónico:</label>
                <input type="email" id="correo" name="correo_electronico" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
            </div>

            <button type="submit">Registrarse</button> <!--envia el formulario al backend-->
        </form>
    </div>
</body>
</html>


{% endblock%}
