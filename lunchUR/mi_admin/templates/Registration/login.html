{% extends 'Layouts/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">

<!-- Mostrar mensajes -->
{% if messages %}
  <ul class="messages">
    {% for message in messages %}
      <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>
        {{ message }}
      </li>
    {% endfor %}
  </ul>
{% endif %}

<!-- Contenedor principal -->
<div class="login-wrapper">
  <div class="login-container">
    <!-- Logo institucional -->
    <img src="{% static 'imagenes/logo_universidad_del_rosario.png' %}" alt="Logo Universidad del Rosario" class="logo">

    <h2>Iniciar Sesión</h2>
    
    <form method="post">
      {% csrf_token %}

      <div class="input-group">
        <label for="username" class="form-label">Usuario</label>
        <input type="text" name="username" id="username" class="form-control" required>
      </div>

      <div class="input-group">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" name="password" id="password" class="form-control" required>
      </div>

      <div class="input-group">
        <label for="Numero_de_id" class="form-label">Número de ID</label>
        <input type="text" name="Numero_de_id" id="Numero_de_id" class="form-control" required>
      </div>

      <button type="submit">Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
